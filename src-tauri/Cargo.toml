[package]
name = "nightverix-client"
version = "0.1.0"
description = "Nightverix Client — launcher de Minecraft"
edition = "2021"
rust-version = "1.75"

[lib]
name = "nightverix_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cliente HTTP async, usado tanto para el login de Microsoft/Xbox/Mojang
# como para descargar el manifest de versiones, librerías, assets y el jar.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

uuid = { version = "1", features = ["v4"] }
dirs = "5"
sysinfo = "0.31"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Extracción de los .tar.gz que reparte Adoptium para Linux/macOS (Windows
# usa .zip, ya cubierto por la dependencia `zip` de arriba) — ver
# java_runtime.rs.
flate2 = "1"
tar = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
